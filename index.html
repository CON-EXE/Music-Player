<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legally Distinct Music Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/main.css">
    <script src="./assets/js/app.js" defer></script>
</head>
<body>
    <main>
        <div class="name-container">
            <h1 class="song-name">Song name goes here</h1>
        </div>
        <div class="controller-container">
            <label for="select" id="select-label">Select Song</label>
            <input type="file" name="select" id="select">
            
            <div class="controller flex">
                <button class="back"><i class="fa-solid fa-backward-step"></i></button>
                <label for="play-pause" id="play-pause-label"><i class="fa-solid fa-circle-play"></i></label>
                <input type="checkbox" id="play-pause"> 
                <button class="forward"><i class="fa-solid fa-forward-step"></i></button>
            </div>
                
                <input type="range" min="0" max="100" value="50" id="volume">
        </div>
    </main>
</body>
</html>
